name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # native module versions must match the Expo SDK, or the app crashes on launch
      - run: npx expo install --check
      - run: npm run typecheck
      - run: npm test
